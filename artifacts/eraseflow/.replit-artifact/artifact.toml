kind = "web"
previewPath = "/"
title = "EraseFlow"
description = "An interactive demo of a privacy request workflow that discovers synthetic personal data across systems, supports human review and simulated execution, verifies results, and generates an audit report."
version = "1.0.0"
id = "artifacts/eraseflow"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25212

[services.development]
run = "pnpm --filter @workspace/eraseflow run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/eraseflow", "run", "build" ]
serve = "static"
publicDir = "artifacts/eraseflow/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25212"
BASE_PATH = "/"
